name: ESP01 MB03+ and eLeMeNt
on:
  push:
    branches: [esp01-mb-el]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tcp-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test driver with simulated UART
        working-directory: ports/esp01
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -g -I. tcp_esp_at.c tests/test_driver.c -o test_driver
          ./test_driver
      - name: Build sjasmplus 1.20.3
        run: |
          git clone --depth 1 --branch v1.20.3 --recursive https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          make -C "$RUNNER_TEMP/sjasmplus" -j2
          "$RUNNER_TEMP/sjasmplus/sjasmplus" --version
      - name: Assemble WiFi BIOS 2.0
        working-directory: ports/esp01
        run: '"$RUNNER_TEMP/sjasmplus/sjasmplus" WifiBios20_MB_EL.a80'
      - name: Compile standalone TCP test with z88dk
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/src" -w /src/ports/esp01 z88dk/z88dk:latest -c 'zcc +zx -lndos -create-app -zorg=24000 -pragma-define:REGISTER_SP=65535 -m -I. -o esp01_tcp_test test_tcp.c tcp_esp_at.c esp_uart_bios.c'
      - name: Check test memory including BSS
        run: python3 ports/esp01/memory_report.py ports/esp01/esp01_tcp_test.map
      - name: Build ESP driver bank
        run: |
          mkdir -p build/esp01-128
          docker run --rm --entrypoint /bin/sh -v "$PWD:/src" -w /src z88dk/z88dk:latest ports/esp01/build_game128.sh
          python3 ports/esp01/bank_layout.py
      - name: Link 128K game
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/src" -w /src z88dk/z88dk:latest ports/esp01/link_game128.sh
          python3 ports/esp01/memory_report.py build/esp01-128/bomber.map
      - name: Pack 128K game tape
        run: |
          python3 ports/esp01/pack_game128.py --prepare
          cd build/esp01-128
          "$RUNNER_TEMP/sjasmplus/sjasmplus" ../../ports/esp01/loader128.a80
          cd ../..
          python3 ports/esp01/pack_game128.py
      - name: Execute bank and game tests in Spectrum 128 emulator
        run: |
          python3 -m venv "$RUNNER_TEMP/esp-emu"
          "$RUNNER_TEMP/esp-emu/bin/pip" install zx==0.13.15 fastapi==0.142.2 uvicorn==0.54.0 websockets==16.0
          "$RUNNER_TEMP/esp-emu/bin/python" ports/esp01/tests/test_bank128.py
          "$RUNNER_TEMP/esp-emu/bin/python" ports/esp01/tests/test_relay128.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp01-game-build
          path: build/esp01-128/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: esp01-tcp-test
          path: ports/esp01/esp01_tcp_test.tap
          if-no-files-found: error
